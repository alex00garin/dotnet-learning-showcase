name: Deploy to Fly.io

on:
  push:
    branches: [ main, dev ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '8.0.x'

    - name: Build
      run: dotnet build DotnetLearningShowcase.csproj --configuration Release

    - name: Install Flyctl
      run: |
        curl -L https://fly.io/install.sh | sh
        echo "FLYCTL_INSTALL=$HOME/.fly" >> $GITHUB_ENV
        echo "PATH=$HOME/.fly/bin:$PATH" >> $GITHUB_ENV

    - name: Set Database URL Secret
      if: success()
      env:
        FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      run: |
        flyctl secrets set DATABASE_URL="${{ secrets.DATABASE_URL }}" --config fly.toml --app dotnet-learning-showcase

    - name: Deploy to Fly
      env:
        FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      run: |
        if ! flyctl apps list | grep -q "dotnet-learning-showcase"; then
          flyctl apps create dotnet-learning-showcase
        fi
        flyctl deploy --config fly.toml --app dotnet-learning-showcase --remote-only 