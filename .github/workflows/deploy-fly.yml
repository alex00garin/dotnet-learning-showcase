name: Deploy Level 2 to Fly.io

on:
  push:
    branches: [ dev, main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '9.0.x'

    - name: Build and Test AdvancedWebApi
      run: |
        dotnet build Level2/AdvancedWebApi/AdvancedWebApi.csproj --configuration Release
        dotnet test Level2/AdvancedWebApi.Tests/AdvancedWebApi.Tests.csproj --configuration Release

    - name: Install Flyctl
      run: |
        curl -L https://fly.io/install.sh | sh
        echo "FLYCTL_INSTALL=$HOME/.fly" >> $GITHUB_ENV
        echo "PATH=$HOME/.fly/bin:$PATH" >> $GITHUB_ENV

    - name: Deploy to Fly
      env:
        FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      run: |
        flyctl deploy --config Level2/fly.toml --remote-only 