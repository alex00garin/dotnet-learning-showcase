app = "advanced-webapi"
primary_region = "iad"

kill_signal = "SIGINT"
kill_timeout = 5

[env]
  ASPNETCORE_ENVIRONMENT = "Production"

[build]
  builder = "paketobuildpacks/builder:base"
  buildpacks = ["paketobuildpacks/dotnet-core"]

[[services]]
  internal_port = 5260
  protocol = "tcp"

  [[services.ports]]
    handlers = ["http"]
    port = 80

  [[services.ports]]
    handlers = ["tls", "http"]
    port = 443 